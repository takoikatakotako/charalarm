name: Test for Application

on:
  workflow_dispatch:
  pull_request:
    paths:
      - application/**
      - local/**
      - .github/workflows/test-application.yml
    branches:
      - main

jobs:
  test_application:
    runs-on: ubuntu-latest
    services:
      moto:
        image: motoserver/moto:5.1.22
        ports:
          - 4566:5000
        env:
          MOTO_HOST: 0.0.0.0

    steps:
    # チェックアウト
    - name: Checkout
      uses: actions/checkout@v4

    # Go言語のセットアップ
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    # DynamoDBテーブル作成
    - name: Create DynamoDB tables
      run: |
        cd local
        bash createTable.sh
      env:
        AWS_ACCESS_KEY_ID: dummy
        AWS_SECRET_ACCESS_KEY: dummy

    # SQS/SNSリソース作成
    - name: Create SQS queues and SNS topics
      run: |
        cd local
        bash createQueue.sh
      env:
        AWS_ACCESS_KEY_ID: dummy
        AWS_SECRET_ACCESS_KEY: dummy

    # Application API のテスト実行
    - name: Run Test
      env:
        AWS_ACCESS_KEY_ID: dummy
        AWS_SECRET_ACCESS_KEY: dummy
      working-directory: application
      run: make test

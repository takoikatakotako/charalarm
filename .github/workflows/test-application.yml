name: Test for Application

on:
  workflow_dispatch:
  # test_application は main の必須チェック。paths で絞るとジョブが走らず結果が付かないので、
  # ワークフローは毎回動かし、対象外の PR では changes で判定してジョブをスキップする（スキップは成功扱い）
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.filter.outputs.application }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # application/、local/、このワークフローに変更があるか
    - name: Filter changed paths
      id: filter
      run: |
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "application=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
          | grep -qE '^(application/|local/|\.github/workflows/test-application\.yml$)'; then
          echo "application=true" >> "$GITHUB_OUTPUT"
        else
          echo "application=false" >> "$GITHUB_OUTPUT"
        fi

  test_application:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-latest
    services:
      moto:
        image: motoserver/moto:5.1.22
        ports:
          - 4566:5000
        env:
          MOTO_HOST: 0.0.0.0

    steps:
    # チェックアウト
    - name: Checkout
      uses: actions/checkout@v4

    # Go言語のセットアップ
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    # DynamoDBテーブル作成
    - name: Create DynamoDB tables
      run: |
        cd local
        bash createTable.sh
      env:
        AWS_ACCESS_KEY_ID: dummy
        AWS_SECRET_ACCESS_KEY: dummy

    # SQS/SNSリソース作成
    - name: Create SQS queues and SNS topics
      run: |
        cd local
        bash createQueue.sh
      env:
        AWS_ACCESS_KEY_ID: dummy
        AWS_SECRET_ACCESS_KEY: dummy

    # Application API のテスト実行
    - name: Run Test
      env:
        AWS_ACCESS_KEY_ID: dummy
        AWS_SECRET_ACCESS_KEY: dummy
      working-directory: application
      run: make test

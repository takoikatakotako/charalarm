name: Apply Terraform

# 手動で apply する（#311）。手順:
#   1. Plan Terraform を手動で実行し、Summary で差分を確認する
#   2. 納得したらこのワークフローを実行する
#
# 誤爆を防ぐため、起動時に環境名をそのまま打ち込ませる（gcp-iac と同じ）。
# apply できるのは GitHub の Environment（terraform-<環境>）のジョブだけで、AWS の apply ロールも
# その Environment からしか引き受けられない。Environment は main からしか動かせない。
# production は Environment の承認（required reviewers）を挟む。
#
# apply の直前にもう一度 plan を出して Summary に残す（実際に何を変えたかの記録）。

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "apply する環境"
        required: true
        default: development
        type: choice
        options:
          - development
          - staging
          - production
      confirm:
        description: "確認: 上で選んだ環境名をそのまま入力（例 development）"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  # 同じ環境への同時 apply を防ぐ。実行中のものは殺さず待たせる。
  group: apply-terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: terraform-${{ inputs.environment }}
    defaults:
      run:
        working-directory: terraform/environment/${{ inputs.environment }}
    steps:
      # 認証より前に落とす。確認入力が合っていなければ何も起きない。
      - name: Verify confirmation input
        if: inputs.confirm != inputs.environment || github.ref != 'refs/heads/main'
        working-directory: .
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          echo "::error::確認入力が環境名と一致しないか、main 以外から起動しています。" \
               "選んだのは '$ENVIRONMENT'、入力は '$CONFIRM'、ref は '$REF'。"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      # 書き込みできるロールを使うのはこのジョブだけ。
      - name: Configure AWS profiles (apply)
        run: ${{ github.workspace }}/.github/scripts/terraform-aws-profiles.sh ${{ inputs.environment }} apply

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      # 何を変えたかを記録に残す。バイナリ plan を保存し、それをそのまま apply する。
      - name: Terraform Plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out="$RUNNER_TEMP/tfplan" 2>&1 | tee "$RUNNER_TEMP/plan.txt"

      - name: Publish plan to summary
        if: always()
        run: |
          {
            echo "## Applied plan (${{ inputs.environment }})"
            echo ""
            echo '```terraform'
            head -c 900000 "$RUNNER_TEMP/plan.txt" 2>/dev/null || true
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply
        run: terraform apply -input=false -no-color "$RUNNER_TEMP/tfplan"

name: Deploy(Dev)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'application/**'
      - 'admin/**'
      - '.github/workflows/deploy-dev.yml'

env:
  AWS_ROLE_ARN: arn:aws:iam::039612872248:role/charalarm-dev-github-actions-role
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: 448049807848.dkr.ecr.ap-northeast-1.amazonaws.com

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    services:
      moto:
        image: motoserver/moto:5.1.22
        ports:
          - 4566:5000
        env:
          MOTO_HOST: 0.0.0.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Create DynamoDB tables
        run: |
          cd local
          bash createTable.sh
        env:
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy

      - name: Create SQS queues and SNS topics
        run: |
          cd local
          bash createQueue.sh
        env:
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy

      - name: Run tests
        working-directory: application
        run: make test
        env:
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy

  build-api:
    name: Build API Image
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-action-role-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        working-directory: application
        run: make build-api-image
        env:
          GITHUB_SHA: ${{ github.sha }}

  build-admin-api:
    name: Build Admin API Image
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-action-role-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Admin API image
        working-directory: application
        run: make build-admin-api-image
        env:
          GITHUB_SHA: ${{ github.sha }}

  build-admin-frontend:
    name: Build Admin Frontend
    runs-on: ubuntu-latest
    outputs:
      out-cache-key: ${{ steps.cache-out.outputs.cache-primary-key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Build
        working-directory: admin
        run: npm run build

      - name: Upload out artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-out
          path: admin/out
          retention-days: 1

  build-batch:
    name: Build Batch Image
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-action-role-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Batch image
        working-directory: application
        run: make build-batch-image
        env:
          GITHUB_SHA: ${{ github.sha }}

  build-worker:
    name: Build Worker Image
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-action-role-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Worker image
        working-directory: application
        run: make build-worker-image
        env:
          GITHUB_SHA: ${{ github.sha }}

  deploy:
    name: Deploy to Development
    needs: [build-api, build-admin-api, build-batch, build-worker]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-action-role-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda functions
        run: |
          aws lambda update-function-code \
            --function-name charalarm-api \
            --image-uri ${{ env.ECR_REGISTRY }}/charalarm-api:latest \
            --region ${{ env.AWS_REGION }} &

          aws lambda update-function-code \
            --function-name charalarm-dev-admin-api \
            --image-uri ${{ env.ECR_REGISTRY }}/charalarm-admin-api:latest \
            --region ${{ env.AWS_REGION }} &

          aws lambda update-function-code \
            --function-name batch-function2 \
            --image-uri ${{ env.ECR_REGISTRY }}/charalarm-batch:latest \
            --region ${{ env.AWS_REGION }} &

          aws lambda update-function-code \
            --function-name worker-function2 \
            --image-uri ${{ env.ECR_REGISTRY }}/charalarm-worker:latest \
            --region ${{ env.AWS_REGION }} &

          wait

      - name: Wait for Lambda updates to complete
        run: |
          aws lambda wait function-updated --function-name charalarm-api --region ${{ env.AWS_REGION }} &
          aws lambda wait function-updated --function-name charalarm-dev-admin-api --region ${{ env.AWS_REGION }} &
          aws lambda wait function-updated --function-name batch-function2 --region ${{ env.AWS_REGION }} &
          aws lambda wait function-updated --function-name worker-function2 --region ${{ env.AWS_REGION }} &
          wait
          echo "All Lambda functions updated successfully!"

      - name: Tag images as dev
        run: |
          for REPO in charalarm-api charalarm-admin-api charalarm-batch charalarm-worker; do
            MANIFEST=$(aws ecr batch-get-image \
              --registry-id 448049807848 \
              --repository-name $REPO \
              --image-ids imageTag=${{ github.sha }} \
              --query 'images[].imageManifest' \
              --output text)
            aws ecr put-image \
              --registry-id 448049807848 \
              --repository-name $REPO \
              --image-tag dev \
              --image-manifest "$MANIFEST"
          done

  deploy-admin-frontend:
    name: Deploy Admin Frontend
    needs: [build-admin-frontend]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-action-role-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download out artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-out
          path: admin-out

      - name: Sync to S3
        run: |
          aws s3 sync admin-out/ s3://charalarm-dev-admin/ \
            --delete \
            --region ${{ env.AWS_REGION }}

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items[?contains(@, 'admin.charalarm-development.swiswiswift.com')]].Id | [0]" \
            --output text)
          if [ -n "$DISTRIBUTION_ID" ] && [ "$DISTRIBUTION_ID" != "None" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths "/*"
          else
            echo "Admin CloudFront distribution not found — skipping invalidation"
          fi

name: Test for iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ios/**
      - .github/workflows/test-ios.yml
    branches:
      - main

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.0.app

jobs:
  test_ios:
    runs-on: macos-15

    steps:
    # チェックアウト
    - uses: actions/checkout@v4

    # SwiftLint はビルド済みのバイナリを使う (mint bootstrap は4つのツールをソースからビルドするので15分かかる)
    # バージョンは Mintfile にそろえる
    - name: Install SwiftLint
      working-directory: ios
      run: |
        version=$(sed -n 's#^realm/swiftlint@##p' Mintfile)
        curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" "https://github.com/realm/SwiftLint/releases/download/${version}/portable_swiftlint.zip"
        unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
        "$RUNNER_TEMP/swiftlint/swiftlint" version

    # swiftlintの実行
    - name: Run SwiftLint
      working-directory: ios
      run: "$RUNNER_TEMP/swiftlint/swiftlint" --strict

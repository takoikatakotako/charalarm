name: Test for Admin

on:
  workflow_dispatch:
  pull_request:
    paths:
      - admin/**
      - .github/workflows/test-admin.yml
    branches:
      - main

jobs:
  test_admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
    # チェックアウト
    - name: Checkout
      uses: actions/checkout@v4

    # Node.js のセットアップ
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: admin/package-lock.json

    # 依存のインストール
    - name: Install dependencies
      run: npm ci

    # lint
    - name: Run lint
      run: npm run lint

    # 静的エクスポートのビルド
    - name: Build
      run: npm run build

site_name: Charalarm Documentation
site_description: キャラクターがモーニングコールしてくれるアプリ「Charalarm」のドキュメント
site_url: https://takoikatakotako.github.io/charalarm/

theme:
  name: material
  language: ja
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

nav:
  - ホーム: index.md
  - システム:
      - システム構成: system/system.md
  - 開発:
      - 開発: development/index.md
      - API エンドポイント: development/api-endpoint.md
      - DynamoDB: development/dynamodb.md
      - SQS: development/sqs.md
      - Moto: development/moto.md
      - 会話API設計: development/conversation-api-design.md
      - iOS: development/ios.md
      - アプリアイコン: development/app-icons.md
      - サブスクリプション: development/subscription.md
      - 端末内TTS設計: on-device-tts-architecture.md
      - TTSの権利・ライセンス: development/tts-rights-and-licensing.md
      - キャラクター:
          - キャラクター: development/chara.md
          - 結衣: development/chara-yui.md
          - 紅葉: development/chara-momiji.md
          - ずんだもん: development/chara-zundamon.md
      - ロードマップ: development/roadmap.md
      - リポジトリ: development/repositories.md
      - 証明書などの更新: development/update.md
      - 問い合わせ対応: development/contact.md
      - ずんだもん音声会話（記録）: development/zundamon-voice-conversation.md
  - その他:
      - 利用規約: other/teams/index.md
      - プライバシーポリシー: other/privacy/index.md
  - テスト: test/index.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html

docs_dir: docs
